name: anisette-server

# Server anisette-v3 tự host trên GitHub Actions, mở ra ngoài bằng Cloudflare
# quick tunnel.
#
# Vì sao workflow này được viết lại (26/10/2026)
# --------------------------------------------
# Bản trước publish status.json đúng MỘT lần lúc bắt đầu, nên khi job bị cancel
# hoặc cloudflared chết, status.json vẫn quảng cáo URL đã chết. Đo thực tế:
# run 40319963400 vẫn ghi URL https://immediately-amazing-promises-exports...,
# sau khi job cancel thì curl URL đó trả **HTTP 530** (tunnel không còn). Client
# (Sideloadtool) đọc anisette từ URL đó, Apple trả 503 HTML, và client báo
# "-80045: server bị Apple từ chối" — sai nguyên nhân.
#
# Bản này thêm: gate kiểm chứng danh tính trước khi publish, xoay danh tính khi
# cần, heartbeat + alive=false khi job kết thúc, và publish lại khi URL đổi.

on:
  workflow_dispatch:
    inputs:
      client_info:
        description: "Danh tính khai với Apple (windows = dùng được; mac10.12 = chỉ để đo)"
        type: choice
        options: [windows, windows-itunes, upstream, mac10.12-diagnostic]
        default: windows
      duration_minutes:
        description: "Thời gian chạy (phút, tối đa 340)"
        default: "340"
      rotate_identity:
        description: "Xoay machine-id nếu danh tính bị Apple từ chối"
        type: choice
        options: ["true", "false"]
        default: "true"
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/**"

concurrency:
  group: anisette-server
  cancel-in-progress: false

permissions:
  contents: write

env:
  ANISETTE_PORT: "6969"
  PATCH_MODE: ${{ github.event.inputs.client_info || 'windows' }}
  DURATION_MIN: ${{ github.event.inputs.duration_minutes || '330' }}
  ROTATE_IDENTITY: ${{ github.event.inputs.rotate_identity || 'true' }}
  # tăng số này mỗi khi sửa patch/build để buộc build lại
  BUILD_REV: "4"
  # vá luôn User-Agent mà thư viện Provision dùng lúc provision ADI (x86_64,
  # chuỗi gốc là akd/1.0 CFNetwork/1404.0.5 Darwin/22.3.0 = macOS 13) cho khớp
  # danh tính khai báo; đặt "0" để tắt.
  PATCH_PROVISION_UA: "1"

jobs:
  serve:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - uses: actions/checkout@v4

      - name: Thông tin môi trường
        run: |
          echo "PATCH_MODE=$PATCH_MODE  DURATION_MIN=$DURATION_MIN  ROTATE_IDENTITY=$ROTATE_IDENTITY"
          lsb_release -ds || head -2 /etc/os-release
          nproc; free -m | head -2

      # ---------------------------------------------------------------- build
      - name: Cache binary + gói dub + lib Apple
        uses: actions/cache@v4
        with:
          # KHÔNG cache $HOME/.config/anisette-v3/device.json: mỗi run phải có
          # machine-id mới (xem README). Chỉ cache thư viện ADI + gói dub.
          path: |
            $HOME/anisette-build/bin
            $HOME/.dub
            $HOME/.config/anisette-v3/lib
          key: av3-${{ runner.os }}-${{ env.PATCH_MODE }}-r${{ env.BUILD_REV }}

      - name: Cài toolchain D (ldc + dub)
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git jq clang libssl-dev zlib1g-dev ldc dub
          # libplist: dependency runtime của thư viện provisioning ADI (dlopen)
          sudo apt-get install -y -qq --no-install-recommends libplist-2.0-3 \
            || sudo apt-get install -y -qq --no-install-recommends libplist3 \
            || sudo apt-get install -y -qq --no-install-recommends libplist-dev
          ldc2 --version | head -3
          dub --version

      - name: Build anisette-v3-server
        run: |
          set -euo pipefail
          mkdir -p "$HOME/anisette-build/bin"
          if [ -x "$HOME/anisette-build/bin/anisette-v3-server" ]; then
            echo "::notice::binary đã có trong cache -> bỏ qua build"
            "$HOME/anisette-build/bin/anisette-v3-server" --help | head -5 || true
            exit 0
          fi

          rm -rf /tmp/av3
          for i in 1 2 3; do
            git clone --depth 1 https://github.com/Dadoum/anisette-v3-server /tmp/av3 && break
            echo "clone loi, thu lai ($i)"; sleep 5
          done
          cd /tmp/av3
          echo "upstream commit: $(git rev-parse --short HEAD)"

          # ---- danh tính client + user agent publish qua /v3/client_info
          #      (client PHẢI dùng đúng cặp này; Apple so khớp từ 12/10/2026)
          case "$PATCH_MODE" in
            windows)
              CI='<PC> <Windows;6.2(0,0);9200> <com.apple.AuthKit/1 (com.apple.akd/1.0)>'
              UA='akd/1.0 CFNetwork/808.1.4' ;;
            windows-itunes)
              CI='<PC> <Windows;6.2(0,0);9200> <com.apple.AuthKit/1 (com.apple.iTunes/12.12.4.1)>'
              UA='akd/1.0 CFNetwork/808.1.4' ;;
            mac10.12-diagnostic)
              # ⚠️ ĐO ĐƯỢC 26/10/2026: machine-id sinh từ ADI Android + khai Mac
              # 10.12.6 → Apple trả -80045 100% (2 server, 4 lần). Chỉ dùng để đo.
              CI='<MacBookPro13,3> <Mac OS X;10.12.6;16G29> <com.apple.AuthKit/1 (com.apple.akd/1.0)>'
              UA='akd/1.0 CFNetwork/811.5.4 Darwin/16.7.0' ;;
            upstream)
              CI=''
              UA='akd/1.0 CFNetwork/808.1.4' ;;
            *) echo "::error::PATCH_MODE không hợp lệ: $PATCH_MODE"; exit 1 ;;
          esac

          if [ -n "$CI" ]; then
            python3 - "$CI" <<'PY'
          import pathlib, sys
          ci = sys.argv[1]
          p = pathlib.Path("source/app.d")
          s = p.read_text()
          old = 'enum clientInfo = "<MacBookPro13,2> <macOS;13.1;22C65> <com.apple.AuthKit/1 (com.apple.akd/1.0)>";'
          assert old in s, "không tìm thấy enum clientInfo — upstream đã đổi, cần xem lại patch"
          p.write_text(s.replace(old, 'enum clientInfo = "%s";' % ci, 1))
          print("PATCH clientInfo ->", ci)
          PY
          fi

          # user_agent trả ở /v3/client_info phải khớp danh tính ở trên
          python3 - "$UA" <<'PY'
          import pathlib, sys
          ua = sys.argv[1]
          p = pathlib.Path("source/app.d")
          s = p.read_text()
          old = '"user_agent": "akd/1.0 CFNetwork/808.1.4"'
          assert old in s, "không tìm thấy user_agent trong /v3/client_info"
          p.write_text(s.replace(old, '"user_agent": "%s"' % ua, 1))
          print("PATCH user_agent ->", ua)
          PY
          grep -n 'enum clientInfo\|"user_agent"' source/app.d || true

          # ---- log lỗi provisioning (upstream nuốt exception)
          python3 -c "import pathlib;p=pathlib.Path('source/app.d');s=p.read_text();a='} catch (Exception) {}';b='} catch (Exception e) { log.error(\"Provisioning FAILED at startup: \", e); }';print('PATCH OK' if a in s else 'PATCH MISS');p.write_text(s.replace(a,b,1))"

          # ---- User-Agent lúc provision ADI (thư viện Provision): mặc định là
          #      "Darwin/22.3.0" (macOS 13) trong khi client-info khai Windows →
          #      không nhất quán. Vá nếu tìm thấy file, không thì cảnh báo.
          if [ "$PATCH_PROVISION_UA" = "1" ] && [ -n "$CI" ]; then
            dub describe >/dev/null 2>&1 || true
            PROV_ADI=$(find "$HOME/.dub/packages" -path '*provision*' -name adi.d 2>/dev/null | head -1)
            if [ -n "$PROV_ADI" ] && grep -q 'CFNetwork/1404.0.5' "$PROV_ADI"; then
              sed -i "s|akd/1.0 CFNetwork/1404.0.5 Darwin/22.3.0|$UA|" "$PROV_ADI"
              echo "::notice::PATCH provisioning UA -> $UA ($PROV_ADI)"
            else
              echo "::warning::không tìm thấy UA provisioning để vá (bỏ qua) — PROV_ADI='$PROV_ADI'"
            fi
          fi

          export DC=ldc2
          dub build -c "static" --build-mode allAtOnce -b release --compiler=ldc2
          install -m 0755 ./anisette-v3-server "$HOME/anisette-build/bin/anisette-v3-server"
          ls -lh "$HOME/anisette-build/bin/"

      # --------------------------------------------------------------- server
      - name: Chạy server + health check
        run: |
          set -uo pipefail
          export XDG_RUNTIME_DIR=/tmp/av3-run
          mkdir -p /tmp/av3-run /tmp/anisette
          BIN="$HOME/anisette-build/bin/anisette-v3-server" ADI="$HOME/.config/anisette-v3" \
            PORT="$ANISETTE_PORT" bash scripts/start_server.sh start
          curl -fsS --max-time 10 "http://127.0.0.1:${ANISETTE_PORT}/v3/client_info" \
            -o /tmp/anisette/client_info.json
          cat /tmp/anisette/client_info.json; echo
          echo "--- server.log ---"; tail -30 /tmp/anisette/server.log

      # ------------------------------------------------------- identity gate
      - name: Kiểm chứng danh tính với Apple (không cần mật khẩu)
        id: gate
        run: |
          set -uo pipefail
          MAX_ROT=2
          ROT=0
          VERDICT=UNKNOWN
          while :; do
            python3 scripts/gsa_probe.py "http://127.0.0.1:${ANISETTE_PORT}" \
              --tries 4 --matrix --json /tmp/anisette/gsa.json >/dev/null 2>&1 || true
            VERDICT=$(jq -r '.verdict // "UNKNOWN"' /tmp/anisette/gsa.json 2>/dev/null || echo UNKNOWN)
            EC=$(jq -r '.ec // "-"' /tmp/anisette/gsa.json 2>/dev/null || echo -)
            echo "gate: verdict=$VERDICT ec=$EC (đã xoay $ROT lần)"
            case "$VERDICT" in
              PASS) break ;;
              ANISETTE_ERROR)
                echo "::error::server không sinh được anisette headers — xem /tmp/anisette/server.log"
                tail -80 /tmp/anisette/server.log || true
                exit 1 ;;
            esac
            if [ "$ROT" -ge "$MAX_ROT" ] || [ "$ROTATE_IDENTITY" != "true" ]; then break; fi
            ROT=$((ROT+1))
            echo "::warning::danh tính bị từ chối/không kết luận được -> xoay machine-id (lần $ROT/$MAX_ROT)"
            BIN="$HOME/anisette-build/bin/anisette-v3-server" ADI="$HOME/.config/anisette-v3" \
              PORT="$ANISETTE_PORT" bash scripts/start_server.sh rotate || exit 1
            curl -fsS --max-time 10 "http://127.0.0.1:${ANISETTE_PORT}/v3/client_info" \
              -o /tmp/anisette/client_info.json
          done
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          case "$VERDICT" in
            PASS)
              echo "::notice::Apple CHẤP NHẬN danh tính (ec=$(jq -r '.ec' /tmp/anisette/gsa.json))" ;;
            IDENTITY_MISMATCH)
              echo "::error::-80045: Apple từ chối NGUỒN GỐC machine-id (ADI Android + khai '$PATCH_MODE'). Đổi PATCH_MODE sang windows, hoặc dùng server Mac ADI thật (mac-ani.jkcoxson.com / ani.stikstore.app) — xoay machine-id KHÔNG chữa được lỗi này." ;;
            EDGE_THROTTLED)
              echo "::warning::Apple edge trả 5xx cho mọi lần thử — chặn theo đợt, KHÔNG phải danh tính sai. Client phải retry với backoff (xem ghi chú trong README)." ;;
            *)
              echo "::warning::gate không kết luận được ($VERDICT)" ;;
          esac
          jq -r '.diagnostics // {} | to_entries[] | "  thử \(.key): \(.value.verdict) (http \(.value.http), ec \(.value.ec))"' \
            /tmp/anisette/gsa.json 2>/dev/null || true

      # --------------------------------------------------------- cloudflare
      - name: Cloudflare quick tunnel
        id: cf
        run: |
          set -uo pipefail
          curl -fsSL -o /tmp/cloudflared \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64
          chmod +x /tmp/cloudflared
          nohup /tmp/cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:${ANISETTE_PORT}" \
            > /tmp/anisette/cf.log 2>&1 &
          echo $! > /tmp/anisette/cf.pid

          URL=""
          for i in $(seq 1 40); do
            URL=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/anisette/cf.log | tail -1 || true)
            [ -n "$URL" ] && break
            sleep 3
          done
          if [ -z "$URL" ]; then
            echo "::warning::không lấy được URL cloudflared"; tail -40 /tmp/anisette/cf.log
            exit 0
          fi
          echo "cf_url=$URL" >> "$GITHUB_OUTPUT"
          echo "::notice::Cloudflare URL = $URL"

          for i in $(seq 1 20); do
            if curl -fsS --max-time 15 "$URL/v3/client_info" -o /dev/null; then
              echo "::notice::tunnel trả lời OK qua Internet"
              exit 0
            fi
            sleep 5
          done
          echo "::warning::tunnel chưa trả lời (DNS trễ?) — vẫn tiếp tục"

      # -------------------------------------------------------------- status
      - name: Công bố URL + trạng thái
        if: ${{ always() }}
        env:
          RUN_ID: ${{ github.run_id }}
          URL_FROM_TUNNEL: ${{ steps.cf.outputs.cf_url }}
          PATCH_MODE: ${{ env.PATCH_MODE }}
          DURATION_MIN: ${{ env.DURATION_MIN }}
        run: |
          set -uo pipefail
          URL="$URL_FROM_TUNNEL"
          DEVICE_ID=$(jq -r '."X-Mme-Device-Id" // empty' /tmp/anisette/v1_probe.json 2>/dev/null || true)
          EXPIRES_AT=$(date -u -d "+${DURATION_MIN} minutes" +%FT%TZ 2>/dev/null || true)
          export URL EXPIRES_AT RUN_ID PATCH_MODE DEVICE_ID
          bash scripts/status_compose.sh
          python3 scripts/status_publish.py /tmp/anisette/status.json --url "$URL" --alive true || \
            echo "::warning::publish status thất bại"

          {
            echo "## 🍏 Anisette server đang chạy"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| ☁️ URL (HTTPS) | \`$URL\` |"
            echo "| Danh tính | \`$PATCH_MODE\` — \`$(jq -r '.client_info // "?"' /tmp/anisette/client_info.json 2>/dev/null)\` |"
            echo "| User-Agent | \`$(jq -r '.user_agent // "?"' /tmp/anisette/client_info.json 2>/dev/null)\` |"
            echo "| GSA gate | \`$(jq -r '.verdict // "UNKNOWN"' /tmp/anisette/gsa.json 2>/dev/null)\` (ec=\`$(jq -r '.ec // "-"' /tmp/anisette/gsa.json 2>/dev/null)\`) |"
            echo "| Hết hạn | \`$EXPIRES_AT\` |"
            echo
            echo "Đọc lại URL bằng máy: \`https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/status/status.json\`"
          } >> "$GITHUB_STEP_SUMMARY"

      # ---------------------------------------------------------- supervisor
      - name: Giữ server sống + heartbeat (tới hết DURATION_MIN)
        env:
          RUN_ID: ${{ github.run_id }}
          PATCH_MODE: ${{ env.PATCH_MODE }}
        run: |
          set -uo pipefail
          PID=$(cat /tmp/anisette/pid)
          END=$(( $(date +%s) + DURATION_MIN * 60 ))
          export EXPIRES_AT=$(date -u -d "@$END" +%FT%TZ 2>/dev/null || true)
          URL=$(jq -r '.url // empty' /tmp/anisette/status.json 2>/dev/null || true)
          FAIL=0; TICK=0
          while [ "$(date +%s)" -lt "$END" ]; do
            sleep 60; TICK=$((TICK+1))

            # 1) server còn sống?
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "::error::anisette server đã chết"; tail -80 /tmp/anisette/server.log; exit 1
            fi
            if curl -fsS --max-time 10 "http://127.0.0.1:${ANISETTE_PORT}/v3/client_info" >/dev/null 2>&1; then
              FAIL=0
            else
              FAIL=$((FAIL+1)); echo "health fail #$FAIL"
              if [ "$FAIL" -ge 5 ]; then
                echo "::error::server không phản hồi 5 lần liên tiếp"; tail -80 /tmp/anisette/server.log; exit 1
              fi
            fi

            # 2) tunnel còn sống? (đây là thứ làm client báo 503/-80045 sai)
            if ! kill -0 "$(cat /tmp/anisette/cf.pid 2>/dev/null)" 2>/dev/null; then
              echo "::warning::cloudflared chết, bật lại"
              nohup /tmp/cloudflared tunnel --no-autoupdate --url "http://127.0.0.1:${ANISETTE_PORT}" \
                >> /tmp/anisette/cf.log 2>&1 &
              echo $! > /tmp/anisette/cf.pid
            fi
            if [ -n "${URL:-}" ] && ! curl -fsS --max-time 15 "$URL/v3/client_info" >/dev/null 2>&1; then
              sleep 10
              NEW=$(grep -oE 'https://[a-z0-9-]+\.trycloudflare\.com' /tmp/anisette/cf.log | tail -1 || true)
              if [ -n "$NEW" ] && [ "$NEW" != "$URL" ] && curl -fsS --max-time 15 "$NEW/v3/client_info" >/dev/null 2>&1; then
                echo "::warning::tunnel đổi URL: $URL -> $NEW (publish lại)"
                URL="$NEW"; export URL
                bash scripts/status_compose.sh >/dev/null
                python3 scripts/status_publish.py /tmp/anisette/status.json --url "$URL" --alive true \
                  || echo "::warning::publish status thất bại"
              else
                echo "::warning::URL $URL không trả lời và chưa có URL mới"
              fi
            fi

            # 3) heartbeat + kiểm tra lại danh tính mỗi 15 phút
            if [ $((TICK % 15)) -eq 0 ]; then
              python3 scripts/gsa_probe.py "http://127.0.0.1:${ANISETTE_PORT}" \
                --tries 3 --json /tmp/anisette/gsa.json >/dev/null 2>&1 || true
              echo "recheck: $(jq -r '.verdict' /tmp/anisette/gsa.json 2>/dev/null)"
              bash scripts/status_compose.sh >/dev/null
              python3 scripts/status_publish.py /tmp/anisette/status.json --url "$URL" --alive true \
                || echo "::warning::publish status thất bại"
            fi
            echo "[$(date -u +%H:%M:%S)] alive (còn $(( (END - $(date +%s)) / 60 )) phút)"
          done
          echo "::notice::hết thời gian, kết thúc job (cron sẽ bật lại)"

      - name: Đánh dấu status đã chết + log cuối
        if: always()
        env:
          RUN_ID: ${{ github.run_id }}
          PATCH_MODE: ${{ env.PATCH_MODE }}
        run: |
          set -uo pipefail
          # Client phải biết URL này chết rồi, đừng dùng nữa.
          bash scripts/status_compose.sh >/dev/null 2>&1 || true
          python3 scripts/status_publish.py /tmp/anisette/status.json --alive false \
            || echo "::warning::publish status (dead) thất bại"
          echo "=== server.log (40 dòng cuối) ==="; tail -40 /tmp/anisette/server.log 2>/dev/null || true
          echo "=== cloudflared.log (15 dòng cuối) ==="; tail -15 /tmp/anisette/cf.log 2>/dev/null || true
